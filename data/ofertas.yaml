ofertas:

  - id: it-ma-playbook
    codigo: ITMA-01
    dossie: ofertas/01-it-ma-playbook.md
    nome: IT M&A Playbook
    nome_no_status: IT M&A Playbook
    nome_no_catalogo: IT M&A Playbook
    familia: estrategia-design
    fases: [strategy]
    lado: [corporate, private-equity]
    tipo_transacao: [aquisicao, integracao, separacao]
    situacao_status_slide: ativa
    no_catalogo_cliente: true
    readiness: { atual: 2.7, alvo_fy: 3.7 }
    descricao_oficial: >-
      Desenvolvimento de Playbook de TI para M&A do cliente, sob medida, para
      preparar a organização de TI na avaliação, preparação, gerenciamento e
      execução de aquisições e integrações ou separações no âmbito de tecnologia.
    deck:
      objetivo: Assessorar e desenvolver as áreas de tecnologia, no estabelecimento de ferramentas e padrões, nas diversas
        etapas de um ciclo de M&A.
      etapas:
      - 01 Compreender
      - 02 Definir
      - 03 Acompanhar (recomendável)
      - 04 Preparar
      dimensoes:
      - IT Due Diligence
      - Plano de integração ou separação
      - Escritório de integração ou separação
      entregaveis:
      - Ferramentas para IT Due Diligence
      - Template personalizado de IT Data Request
      - Modelos de estimativas financeiras para o Business Plan
      - Drivers de priorização do roadmap de integração ou separação
      - Ferramentas de planejamento da integração ou separação
      - Checklist de tomada de controle
      - Plano de treinamento da operação personalizado
      - IT Tactical design (exemplo)
      momento: Não informado no deck
      prazo: Não informado no deck
      modelo_comercial: Não informado no deck
      cases: []
    analise:
      proposta_de_valor: "Transforma M&A de evento heroico em capacidade organizacional repetível."
      cliente_ideal: "Corporates e plataformas de PE com tese de buy-and-build (aquisições recorrentes)."
      gatilhos: ["Plano de aquisições anunciado", "Integração anterior com problemas", "Novo CIO/CFO com agenda inorgânica"]
      kpis: ["Tempo até Day 1", "% de sinergias de TI capturadas", "Reuso de artefatos entre deals"]
      conexoes: [it-due-diligence-buy-side, it-integration-separation-planning]

  - id: it-due-diligence-buy-side
    codigo: ITMA-02
    dossie: ofertas/02-it-due-diligence-buy-side.md
    nome: IT Due Diligence (Buy Side)
    nome_no_status: IT Due Diligence (Private Equity)
    nome_no_catalogo: IT Due Diligence (Buy Side) PE or VC
    familia: diligencia
    fases: [pre-deal]
    lado: [private-equity, venture-capital]
    tipo_transacao: [aquisicao]
    situacao_status_slide: ativa
    no_catalogo_cliente: true
    readiness: { atual: 4.5, alvo_fy: 4.7 }
    descricao_oficial: >-
      Identificar potenciais riscos ou problemas que possam influenciar no valor
      do deal, avaliar sinergias e garantir que os investimentos de TI serão
      considerados dentro do plano estratégico do deal.
    deck:
      objetivo: Mapear o cenário atual (As-Is), identificar riscos e oportunidades e endereçá-los com recomendações
        (iniciativas de mitigação e enablers).
      etapas:
      - 01 Compreender
      - 02 Capturar & Avaliar
      - 03 Recomendar
      dimensoes:
      - Pessoas
      - Governança
      - Segurança
      - Infraestrutura
      - Sistemas
      - Digital
      entregaveis:
      - Findings por dimensão
      - Assessment de disciplinas e maturidade
      - Matriz de riscos
      - Recomendações com prazo, CAPEX e OPEX em cenários worst/base/best
      - Avaliação de maturidade As-Is
      momento: Pré-deal
      prazo: 'Até 6 semanas (variante VC On Demand: 2 a 3 semanas)'
      modelo_comercial: 'Profundidade sob medida (níveis 1 a 3 por disciplina). Variante VC em modelos VMaaS: On Demand
        (R$ 35k/semana), Package (anual/semestral, consumo por acionamento) e Full Cycle (as-a-service, faturamento
        mensal).'
      cases:
      - 'CERC: IT DD para possível investimento do Mubadala Capital'
      - 'Virutex Ilko (Chile): 17 iniciativas mapeadas, base do plano de integração'
      - 'Braveo (tese de distribuição de FMCG): IT DDs e planejamento de PMI de 4 das 15 investidas'
    analise:
      proposta_de_valor: "Traduz a TI do alvo em linguagem de deal: risco, CAPEX/OPEX oculto e alavancas de valor."
      cliente_ideal: "Fundos de PE e VC em processo competitivo de aquisição."
      gatilhos: ["Abertura de data room (VDR)", "Carta de intenções (LOI) assinada", "Ativo com TI crítica para a tese"]
      kpis: ["Ajustes de preço/cláusulas originados pela DD de TI", "Prazo de entrega do relatório", "Precisão das estimativas vs. realizado"]
      conexoes: [it-integration-separation-planning, it-synergies-value-creation]

