# =============================================================================
#  CATÁLOGO IT M&A · Alvarez & Marsal · Digital & Technology Services (DTS)
#  Fonte única da verdade. Toda a documentação e o painel derivam deste arquivo.
#
#  Convenção de proveniência de cada campo:
#    descricao_oficial  -> texto transcrito do slide "A&M É M&A" (fonte primária)
#    readiness          -> slide "Status das Ofertas – IT M&A" (fonte primária)
#    deck.*             -> Deck Comercial DTS M&A Full v7 (fonte primária)
#    analise.*          -> síntese analítica deste repositório, A VALIDAR com o PO
#
#  Nas descrições oficiais só foram corrigidos erros de digitação do slide
#  (ex.: "para da transação" -> "para a transação"). O sentido não foi alterado.
# =============================================================================

meta:
  firma: Alvarez & Marsal (A&M)
  pratica: Digital & Technology Services (DTS)
  service_line: IT M&A
  experiencia_declarada: "mais de 20 anos de experiência de atuação global"
  atualizado_em: "2026-10-05"
  # Os arquivos-fonte brutos NÃO são versionados neste repositório.
  fontes:
    - id: deck-comercial
      titulo: "Deck Comercial - DIGITAL & TECHNOLOGY SERVICES - M&A - Full v7.pdf"
      tipo: deck comercial completo (PDF, 10,9 MB)
      status_ingestao: analisado
    - id: slide-status
      titulo: "Status das Ofertas – IT M&A"
      tipo: slide interno de governança
      status_ingestao: analisado
    - id: slide-catalogo
      titulo: "A&M é M&A"
      tipo: slide de posicionamento (também presente no deck comercial)
      status_ingestao: analisado
    - id: deck-one-pagers
      titulo: "One-pagers DTS.pptx"
      tipo: deck de one-pagers (123 MB)
      status_ingestao: pendente
      observacao: "Aguardando versão em partes menores que 10 MB. Ver fontes/README.md."

# Escala oficial de readiness (legenda do slide de status)
escala_readiness:
  - nivel: 1
    nome: Oferta incompleta
    risco: muito alto
  - nivel: 2
    nome: Oferta inicial
    risco: alto
  - nivel: 3
    nome: Oferta definida
    risco: médio
  - nivel: 4
    nome: Oferta estruturada
    risco: baixo
  - nivel: 5
    nome: Oferta otimizada
    risco: muito baixo

# Indicadores consolidados declarados no slide (o script valida que batem
# com a média simples das ofertas).
indicadores_service_line:
  readiness_atual: 3.29
  readiness_alvo_fy: 3.95

# Ciclo de vida do deal (linha do tempo do slide "A&M é M&A")
fases:
  - id: strategy
    ordem: 1
    nome: M&A Strategy
    pergunta_do_cliente: "Nossa TI está preparada para fazer M&A de forma recorrente e previsível?"
  - id: pre-deal
    ordem: 2
    nome: Pré-deal
    pergunta_do_cliente: "Quais riscos e oportunidades de TI mudam o valor (e o preço) deste deal?"
  - id: sign-to-close
    ordem: 3
    nome: Sign-to-Close
    pergunta_do_cliente: "Como chegamos ao Day 1 sem ruptura e com o valor já endereçado?"
  - id: first-100-days
    ordem: 4
    nome: 100 days
    pergunta_do_cliente: "Como capturar as sinergias de TI no menor tempo possível?"
  - id: hold
    ordem: 5
    nome: Hold period (~3-5 anos)
    pergunta_do_cliente: "Como a TI multiplica o valor do ativo durante o ciclo de investimento?"
  - id: exit
    ordem: 6
    nome: Exit
    pergunta_do_cliente: "Como preparar a TI para vender pelo melhor valor, sem surpresas na diligência?"

# Famílias propostas (análise) para leitura do portfólio
familias:
  - id: estrategia-design
    nome: Estratégia & Design
  - id: diligencia
    nome: Diligência
  - id: planejamento-execucao
    nome: Planejamento & Execução
  - id: valor
    nome: Criação de Valor

# -----------------------------------------------------------------------------
#  OFERTAS
#  situacao_status_slide: ativa | riscada  (linha tachada no slide de status)
